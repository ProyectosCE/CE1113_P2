# Integración continua del reproductor:
#   - commits:  mensajes de commit y título del PR en formato [TAG] Descripción
#               (docs/development/commit-convention.md)
#   - lint-sv:  lint del hardware propio (SystemVerilog) con Verilator
#   - firmware: compilación del software del ARM (make sw) sin warnings
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Formato de commits ([TAG] Descripción)
    runs-on: ubuntu-24.04
    env:
      # docs/development/commit-convention.md: uno o dos tags y una descripción breve
      PATRON: '^(\[(ADD|UPDATE|FIX|DEL|DOCS|TEST|REFACTOR)\]){1,2} [^ ].*'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar mensajes de commit
        env:
          EVENTO: ${{ github.event_name }}
          BASE_PR: ${{ github.event.pull_request.base.sha }}
          HEAD_PR: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
        run: |
          if [ "$EVENTO" = "pull_request" ]; then
            rango="$BASE_PR..$HEAD_PR"
          elif [ -n "$ANTES" ] && [ "$ANTES" != "0000000000000000000000000000000000000000" ]; then
            rango="$ANTES..$GITHUB_SHA"
          elif git rev-parse -q --verify origin/develop >/dev/null; then
            rango="origin/develop..$GITHUB_SHA"   # rama nueva: sus commits respecto a develop
          else
            rango="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          echo "Commits revisados: $rango"
          fallas=0
          while IFS=$'\t' read -r sha asunto; do
            [ -n "$sha" ] || continue
            if printf '%s\n' "$asunto" | grep -Eq "$PATRON"; then
              echo "ok    ${sha:0:7} $asunto"
            else
              echo "::error::${sha:0:7} no sigue el formato [TAG] Descripción: $asunto"
              fallas=$((fallas + 1))
            fi
          done < <(git log --no-merges --format='%H%x09%s' "$rango")
          if [ "$fallas" -gt 0 ]; then
            echo "Tags permitidos: [ADD] [UPDATE] [FIX] [DEL] [DOCS] [TEST] [REFACTOR] (máximo dos)."
            echo "Ver docs/development/commit-convention.md"
            exit 1
          fi

      - name: Validar el título del PR
        if: github.event_name == 'pull_request'
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s\n' "$TITULO" | grep -Eq "$PATRON"; then
            echo "ok    $TITULO"
          else
            echo "::error::El título del PR no sigue el formato [TAG] Descripción: $TITULO"
            exit 1
          fi

  lint-sv:
    name: Lint SystemVerilog (Verilator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Verilator
        run: sudo apt-get update && sudo apt-get install -y verilator

      - name: Lint de Reproductor/ip
        run: |
          verilator --version
          fallas=0
          for sv in Reproductor/ip/*/*.sv; do
            top=$(basename "$sv" .sv)
            echo "::group::$top"
            if verilator --lint-only -Wall -Wno-UNUSEDSIGNAL -Wno-UNUSEDPARAM \
                 --top-module "$top" "$sv"; then
              echo "OK: $top"
            else
              echo "::error file=$sv::Lint con errores o warnings en $top"
              fallas=$((fallas + 1))
            fi
            echo "::endgroup::"
          done
          exit $fallas

  firmware:
    name: Compilar firmware (ARM)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Instalar toolchain ARM
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi binutils-arm-none-eabi make

      - name: make sw
        run: |
          set -o pipefail
          make -C Reproductor sw 2>&1 | tee build-sw.log
          if grep -q "warning:" build-sw.log; then
            echo "::error::El firmware compila con warnings (ver el log)"
            exit 1
          fi

      - name: Guardar ELF y mapa de memoria
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            Reproductor/sw/build/reproductor.elf
            Reproductor/sw/build/reproductor.map
